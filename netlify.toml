# ==============================================================================
# Netlify Deployment Configuration
# ==============================================================================
# Database: Supabase PostgreSQL (Managed, serverless-ready)
# Configure DATABASE_URL (pooled URL, port 6543) and DIRECT_URL (direct URL, port 5432)
# in Netlify Environment Variables.
# ==============================================================================

[build]
  command = "npm i --no-save @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu && npx prisma generate && next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
