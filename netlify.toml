# ==============================================================================
# Netlify Deployment Configuration
# ==============================================================================
# ⚠️ ARCHITECTURAL WARNING:
# Netlify serverless functions and lambda workers are stateless and ephemeral.
# Local SQLite (file:./dev.db) is strictly for local development and single-node MVP.
# In a serverless deployment like Netlify, SQLite writes will NOT persist across
# cold starts, lambda recycling, or concurrent instances.
# For production durability, connect to a managed database (PostgreSQL on Supabase,
# Neon, RDS, or distributed SQLite on Turso/LibSQL).
# ==============================================================================

[build]
  command = "npm i --no-save @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu && npx prisma generate && next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
